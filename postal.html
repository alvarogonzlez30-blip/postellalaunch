<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>postella · participa</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500&family=Bagel+Fat+One&display=swap" rel="stylesheet"><style>
:root{--pink:#F5B0BD;--cream:#EFEAE7;--brown:#AE8774;--ink:#49332d;--deep:#d97891}*{box-sizing:border-box}body{margin:0;padding:20px;background:radial-gradient(circle at 5% 5%,#f6dce2,transparent 35%),#f6f2ee;color:var(--ink);font-family:Fredoka,sans-serif}main{max-width:560px;margin:auto}.brand{font:38px 'Bagel Fat One';color:var(--deep)}h1{font:42px/1 'Bagel Fat One';margin:10px 0}p{color:#806a60;line-height:1.4}.panel{background:#fffdf9;border:1px solid #ead8d1;border-radius:23px;padding:20px;margin:15px 0;box-shadow:0 12px 34px #49332d10}button,.choice{border:0;border-radius:14px;padding:13px;background:#f7e3e6;color:var(--ink);font:17px Fredoka;cursor:pointer}.menu{display:grid;grid-template-columns:1fr;gap:10px}.menu button{min-height:80px;text-align:left;font-size:19px}.menu small{font-size:13px}textarea,input{width:100%;border:1px solid #e1c8c3;border-radius:14px;padding:14px;font:17px Fredoka;margin:8px 0;background:white;resize:vertical}.send{width:100%;background:var(--ink);color:white;font:20px 'Bagel Fat One'}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button.selected{background:var(--pink);outline:2px solid var(--deep)}.status{min-height:24px;text-align:center;color:#9b6570;margin-top:10px}.back{background:transparent;padding:8px 0;color:#98796f}small{color:#927b70}.hidden{display:none!important}.hint{font-size:14px;margin-top:0}.counter{text-align:right;font-size:12px;color:#927b70}
</style></head><body><main><div class="brand">postella 💌</div><h1>¡participa en<br>POSTELLA FEST!</h1><p>Tu móvil forma parte de nuestra presentación. Elige una experiencia y deja tu huella.</p>
<div class="panel" id="menu"><h2>Elige tu experiencia</h2><div class="menu"><button data-kind="word">☁️ The Postella Cloud<br><small>Una palabra para llenar nuestra nube colectiva</small></button><button data-kind="idea">✨ The Collection Lab<br><small>Diseña la próxima colección de postella</small></button><button data-kind="pack">🎁 Build Your Postella<br><small>Elige los productos que serían tus favoritos</small></button><button data-kind="postcard">💌 Enviar una postal<br><small>Deja un mensaje en nuestro mural colectivo</small></button></div></div>
<div class="panel hidden" id="activity"><button class="back" id="back">← volver</button><h2 id="activityTitle"></h2><p id="activityPrompt"></p><div id="activityInput"></div><button class="send" id="submit">Enviar 💌</button><div class="status" id="status"></div></div>
<p style="text-align:center"><small>postella · haz que llegue</small></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://yfdbljqdqvfxuiscvczp.supabase.co","sb_publishable_n3YJfrHAyxHcAvmOSv5DTQ_DCGewVBX");let kind='',choice='';
const titles={word:'The Postella Cloud',idea:'The Collection Lab',pack:'Build Your Postella',postcard:'Envía una postal'};
const prompts={word:'Si piensas en recibir una postal, ¿qué única palabra te viene a la cabeza?',idea:'Imagina la próxima colección de postella. Cuéntanos cómo se llamaría, qué la inspiraría y qué productos tendría. ¡Sorpréndenos!',pack:'¿Qué productos te gustaría encontrar en postella? Puedes elegir todos los que quieras.',postcard:'Escribe un mensaje bonito, una dedicatoria o unas palabras que te gustaría hacer llegar. Aparecerá en nuestro mural de postales.'};
const input=document.getElementById('activityInput');
function render(){input.innerHTML='';choice='';
 if(kind==='pack') input.innerHTML='<div class="choices">'+['Postales','Jellycat','Cerámica','Papelería','Pequeños regalos','Photobooth'].map(x=>'<button type="button" data-choice="'+x+'">'+x+'</button>').join('')+'</div><p class="hint">Puedes seleccionar más de uno.</p>';
 else if(kind==='word') input.innerHTML='<textarea id="answer" maxlength="24" rows="2" placeholder="Una palabra…"></textarea><div class="counter">máximo 24 caracteres</div>';
 else if(kind==='postcard') input.innerHTML='<textarea id="answer" maxlength="180" rows="5" placeholder="Querida vida…"></textarea><div class="counter">máximo 180 caracteres</div>';
 else input.innerHTML='<textarea id="answer" maxlength="300" rows="5" placeholder="Nombre de la colección, inspiración, productos…"></textarea><div class="counter">máximo 300 caracteres</div>'; 
 input.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{b.classList.toggle('selected');choice=[...input.querySelectorAll('.selected')].map(x=>x.dataset.choice).join(',')});
}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.getElementById('menu').classList.add('hidden');document.getElementById('activity').classList.remove('hidden');document.getElementById('activityTitle').textContent=titles[kind];document.getElementById('activityPrompt').textContent=prompts[kind];document.getElementById('status').textContent='';render()});
document.getElementById('back').onclick=()=>{document.getElementById('activity').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')};
document.getElementById('submit').onclick=async()=>{let content='',selected=choice;
 if(kind==='pack'){if(!selected){document.getElementById('status').textContent='Selecciona al menos un producto.';return}}
 else{content=(document.getElementById('answer')?.value||'').trim();if(!content){document.getElementById('status').textContent='Escribe algo antes de enviar.';return}if(kind==='word'&&/\s/.test(content)){document.getElementById('status').textContent='¡Solo una palabra!';return}}
 const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Enviando…';
 const {error}=await db.from('postella_activities').insert({kind,content,choice:selected||''});
 btn.disabled=false;btn.textContent='Enviar 💌';
 if(error){document.getElementById('status').textContent='No se ha podido enviar: '+error.message;return}
 document.getElementById('status').textContent='¡Recibido! Tu participación ya forma parte de POSTELLA FEST 💗';
 if(document.getElementById('answer'))document.getElementById('answer').value='';input.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));choice='';
};
</script></body></html>
