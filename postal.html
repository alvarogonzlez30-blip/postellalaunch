<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>postella · participa</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500&family=Bagel+Fat+One&display=swap" rel="stylesheet"><style>
:root{--pink:#F5B0BD;--cream:#EFEAE7;--brown:#AE8774;--ink:#49332d;--deep:#d97891}*{box-sizing:border-box}body{margin:0;padding:20px;background:radial-gradient(circle at 5% 5%,#f6dce2,transparent 35%),#f6f2ee;color:var(--ink);font-family:Fredoka,sans-serif}main{max-width:560px;margin:auto}.brand{font:38px 'Bagel Fat One';color:var(--deep)}h1{font:42px/1 'Bagel Fat One';margin:10px 0}p{color:#806a60;line-height:1.4}.panel{background:#fffdf9;border:1px solid #ead8d1;border-radius:23px;padding:20px;margin:15px 0;box-shadow:0 12px 34px #49332d10}button,.choice{border:0;border-radius:14px;padding:13px;background:#f7e3e6;color:var(--ink);font:17px Fredoka;cursor:pointer}.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menu button{min-height:75px;text-align:left}textarea,input{width:100%;border:1px solid #e1c8c3;border-radius:14px;padding:14px;font:17px Fredoka;margin:8px 0;background:white}.send{width:100%;background:var(--ink);color:white;font:20px 'Bagel Fat One'}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button.selected{background:var(--pink);outline:2px solid var(--deep)}.status{min-height:24px;text-align:center;color:#9b6570;margin-top:10px}.back{background:transparent;padding:8px 0;color:#98796f}small{color:#927b70}.hidden{display:none!important}
</style></head><body><main><div class="brand">postella 💌</div><h1>¡participa en<br>POSTELLA FEST!</h1><p>Tu móvil forma parte de nuestra presentación. Elige una experiencia y deja tu huella.</p>
<div class="panel" id="menu"><h2>¿Qué te apetece hacer?</h2><div class="menu"><button data-kind="word">☁️ The Postella Cloud<br><small>Una palabra</small></button><button data-kind="idea">✨ Crea una colección<br><small>Tu idea</small></button><button data-kind="vote">🎨 Dirección creativa<br><small>Vota tu favorita</small></button><button data-kind="price">🏷️ The Price Is Right<br><small>Adivina el precio</small></button><button data-kind="postcard">💌 Envía una postal<br><small>Un mensaje bonito</small></button><button data-kind="pack">🎁 Build Your Postella<br><small>Diseña el pack</small></button></div></div>
<div class="panel hidden" id="activity"><button class="back" id="back">← volver</button><h2 id="activityTitle"></h2><p id="activityPrompt"></p><div id="activityInput"></div><button class="send" id="submit">Enviar 💌</button><div class="status" id="status"></div></div>
<p style="text-align:center"><small>postella · haz que llegue</small></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://yfdbljqdqvfxuiscvczp.supabase.co","sb_publishable_n3YJfrHAyxHcAvmOSv5DTQ_DCGewVBX");let kind='',choice='';
const titles={word:'The Postella Cloud',idea:'Create the Next Collection',vote:'You Are the Creative Director',price:'The Price Is Right',postcard:'Send a Postcard',pack:'Build Your Postella'};
const prompts={word:'¿Qué palabra relacionas con recibir una postal?',idea:'Inventa una colección nueva para postella. ¿Cómo se llamaría?',vote:'Elige la colección que lanzarías primero.',price:'¿Cuánto pagarías por un pack de postales ilustradas?',postcard:'¿Qué frase te gustaría recibir en una postal?',pack:'Elige los elementos que tendría tu pack ideal.'};
const input=document.getElementById('activityInput');
function render(){
 input.innerHTML='';choice='';
 if(kind==='vote') input.innerHTML='<div class="choices">'+['Summer Memories','Little Things','Love Notes','Around the World'].map(x=>'<button type="button" data-choice="'+x+'">'+x+'</button>').join('')+'</div>';
 else if(kind==='price') input.innerHTML='<div class="choices">'+['3,50 €','5,90 €','8,90 €','14,90 €'].map(x=>'<button type="button" data-choice="'+x+'">'+x+'</button>').join('')+'</div>';
 else if(kind==='pack') input.innerHTML='<div class="choices">'+['Postal','Stickers','Notebook','Envelope','Gift'].map(x=>'<button type="button" data-choice="'+x+'">'+x+'</button>').join('')+'</div>';
 else input.innerHTML='<textarea id="answer" maxlength="'+(kind==='word'?24:120)+'" placeholder="'+(kind==='word'?'Una palabra…':'Escribe aquí…')+'"></textarea>';
 input.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(kind==='pack'){b.classList.toggle('selected');choice=[...input.querySelectorAll('.selected')].map(x=>x.dataset.choice).join(',')}else{input.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');choice=b.dataset.choice}});
}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.getElementById('menu').classList.add('hidden');document.getElementById('activity').classList.remove('hidden');document.getElementById('activityTitle').textContent=titles[kind];document.getElementById('activityPrompt').textContent=prompts[kind];document.getElementById('status').textContent='';render()});
document.getElementById('back').onclick=()=>{document.getElementById('activity').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')};
document.getElementById('submit').onclick=async()=>{
 let content='',selected=choice;
 if(['vote','price','pack'].includes(kind)){if(!selected){document.getElementById('status').textContent='Elige una opción primero.';return}}
 else{content=(document.getElementById('answer')?.value||'').trim();if(!content){document.getElementById('status').textContent='Escribe algo antes de enviar.';return}}
 const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Enviando…';
const {error}=await db.from('postella_activities').insert({kind,content,choice:selected||''});
 btn.disabled=false;btn.textContent='Enviar 💌';
 if(error){document.getElementById('status').textContent='No se ha podido enviar: '+error.message;return}
 document.getElementById('status').textContent='¡Recibido! Tu participación ya está en POSTELLA FEST 💗';
 if(document.getElementById('answer'))document.getElementById('answer').value='';
};
</script></body></html>
